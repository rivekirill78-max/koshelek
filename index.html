<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кошелёк</title>
<meta name="description" content="Личный учёт денег: счета, доходы и расходы, долги, валюты.">
<meta name="theme-color" content="#0E6B58">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кошелёк">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky month bar, scrolling view, fixed bottom tab bar + floating add button. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --fg:#13201C; --muted:#5B6B65; --line:#D9E1DD;
  --accent:#0E6B58; --accent-fg:#FFFFFF; --accent-soft:#D5EBE4;
  --inc:#17824A; --exp:#BF3E2B; --trf:#4565B0; --warn:#B7791F;
  --c1:#0E6B58; --c2:#D2643C; --c3:#4565B0; --c4:#B7791F; --c5:#8A4FA8; --c6:#2E8FA3; --c7:#C04A7A; --c8:#6B7F3A; --c9:#7A6A5C; --c10:#3D7D5A; --c11:#9C5B2E;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(19,32,28,.06),0 6px 20px rgba(19,32,28,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201D; --surface-2:#1E2A26; --fg:#E4EDEA; --muted:#93A39D; --line:#26332F;
  --accent:#43C2A3; --accent-fg:#06231C; --accent-soft:#163A31;
  --inc:#52C485; --exp:#EF7A63; --trf:#8EA7E9; --warn:#E3AE57;
  --c1:#43C2A3; --c2:#EE8A62; --c3:#8EA7E9; --c4:#E3AE57; --c5:#BE8BDA; --c6:#5FC1D3; --c7:#EB86B0; --c8:#A9BE6C; --c9:#B9A898; --c10:#79C39A; --c11:#D7955F;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --surface-2:#1E2A26; --fg:#E4EDEA; --muted:#93A39D; --line:#26332F;
  --accent:#43C2A3; --accent-fg:#06231C; --accent-soft:#163A31;
  --inc:#52C485; --exp:#EF7A63; --trf:#8EA7E9; --warn:#E3AE57;
  --c1:#43C2A3; --c2:#EE8A62; --c3:#8EA7E9; --c4:#E3AE57; --c5:#BE8BDA; --c6:#5FC1D3; --c7:#EB86B0; --c8:#A9BE6C; --c9:#B9A898; --c10:#79C39A; --c11:#D7955F;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:15px;padding-top:env(safe-area-inset-top,0px);min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.month button:hover{background:var(--surface-2)}
.month span{min-width:112px;text-align:center;font-weight:700;font-size:14px}
main.wrap{padding-block:4px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}

.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13.5px}
.alert{background:color-mix(in srgb,var(--exp) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--exp) 45%,transparent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.alert > b{color:var(--exp);font-size:15px}
.alert p{margin:0}
.alert .diag{color:var(--muted);font-size:11.5px;user-select:text;-webkit-user-select:text}
.alert .sel{user-select:all;-webkit-user-select:all;word-break:break-all}
.alert .btn{text-decoration:none;display:inline-block}
.alert ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.note.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:14px}

/* Hero */
.hero{background:var(--accent);color:var(--accent-fg);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:28px solid color-mix(in srgb,var(--accent-fg) 10%,transparent);pointer-events:none}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;margin-bottom:-12px}
.hero-top .lbl{min-width:0}
.hero > .big{position:relative;z-index:1;white-space:nowrap;margin-top:0}
.hero-toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:6px 11px 6px 7px;font-weight:700;font-size:12.5px;background:color-mix(in srgb,var(--accent-fg) 16%,transparent);color:var(--accent-fg);white-space:nowrap}
.hero-toggle .sw{width:26px;height:15px;border-radius:999px;background:color-mix(in srgb,var(--accent-fg) 35%,transparent);position:relative;transition:background .15s}
.hero-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--accent-fg);transition:transform .15s}
.hero-toggle[aria-pressed="true"]{background:var(--accent-fg);color:var(--accent)}
.hero-toggle[aria-pressed="true"] .sw{background:var(--accent)}
.hero-toggle[aria-pressed="true"] .sw::after{transform:translateX(11px);background:var(--accent-fg)}
@media (prefers-reduced-motion:reduce){.hero-toggle .sw,.hero-toggle .sw::after{transition:none}}
.hero-debts{font-size:12.5px;font-weight:600;opacity:.9;margin-top:-8px;position:relative;z-index:1}
.hero .big{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,40px);letter-spacing:-.02em;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero-row div{background:color-mix(in srgb,var(--accent-fg) 12%,transparent);border-radius:12px;padding:8px 10px;min-width:0}
.hero-row small{display:block;font-size:11.5px;opacity:.85;font-weight:600}
.hero-row b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Accounts */
.accs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.accs::-webkit-scrollbar{display:none}
.acc{flex:0 0 auto;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.acc small{color:var(--muted);font-weight:600;font-size:12.5px}
.acc b{font-size:16px}
.acc .neg{color:var(--exp)}
.acc{position:relative;padding-right:44px}
.acc-plus{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;border:0;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;line-height:1}
.acc-new{border-style:dashed;background:none;color:var(--accent);align-items:flex-start;justify-content:center;padding-right:14px;min-width:120px;font:inherit}
.acc-new b{font-size:22px;line-height:1}
.cur-chips .chip{display:inline-flex;align-items:center;gap:6px}
.cur-chips .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.cur-chips .chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through;background:var(--surface)}
.acc-new small{color:var(--accent)}
.hero-act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero-act button{border:0;border-radius:12px;padding:11px 6px;font-weight:800;font-size:14px;background:var(--accent-fg);color:var(--accent);white-space:nowrap}
.hero-act button span{font-size:16px}
.row.row4{grid-template-columns:1fr 104px 74px auto}
.row select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px}
.row.rate{grid-template-columns:90px 1fr auto}
.row.rate span{color:var(--muted);font-weight:700}

/* Transactions */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:12.5px;color:var(--muted);font-weight:700}
.tx{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 14px}
.tx:hover{background:var(--surface-2)}
.tx + .tx,.day + .tx{border-top:0}
.list > .tx:not(:first-child),.list > .day:not(:first-child){border-top:1px solid var(--line)}
.ico{flex:0 0 36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap}
.amt.income{color:var(--inc)} .amt.transfer{color:var(--trf)}
.demo.nostat{color:var(--muted)}
.nostat-check{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
.nostat-check small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.demo{font-size:10.5px;font-weight:800;color:var(--warn);border:1px solid currentColor;border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:1px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}

/* Budgets / analytics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:200px;height:200px;flex:0 0 auto;max-width:100%;margin:0 auto}
.donut text{fill:var(--fg);font-family:var(--body)}
.donut text.pct{fill:#fff;font-size:12.5px;font-weight:800;paint-order:stroke;stroke:rgba(0,0,0,.32);stroke-width:2.6px;stroke-linejoin:round}
.lg .pc b{color:var(--fg);font-weight:800}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumrow > div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sumrow small{color:var(--muted);font-weight:600;font-size:12px}
.sumrow b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumrow b.inc{color:var(--inc)} .sumrow b.exp{color:var(--exp)}
.ratio{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.ratio span{display:block;height:100%}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center}
.lg i{width:10px;height:10px;border-radius:3px}
.lg .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .pc{color:var(--muted);font-size:12.5px;font-weight:600}
.bar{grid-column:2/4;height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px}
.lg .sub{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-2px}
.over{color:var(--exp)!important;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.col .pair{display:flex;gap:3px;align-items:flex-end;height:110px;width:100%;justify-content:center}
.col .pair span{width:40%;max-width:16px;border-radius:4px 4px 2px 2px;min-height:2px}
.col small{font-size:11.5px;color:var(--muted);font-weight:600}
.col.cur small{color:var(--fg);font-weight:800}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:10px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Settings */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.row label{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.row label i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px}
.x:hover{background:var(--surface-2);color:var(--exp)}
.x[disabled]{opacity:.3;cursor:not-allowed}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:color-mix(in srgb,var(--exp) 14%,var(--surface));color:var(--exp)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.help{color:var(--muted);font-size:13.5px;margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Tab bar + FAB */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
/* Debts */
.dsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsum > *{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.dsum small{color:var(--muted);font-weight:600;font-size:12.5px}
.dsum b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsum .in{color:var(--inc)} .dsum .out{color:var(--exp)}
.debts{display:flex;flex-direction:column;gap:10px}
.debt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 0 12px;display:flex;flex-direction:column;gap:8px}
.debt .tx{padding-block:10px 4px}
.debt .tx .t2{white-space:normal}
.debt .bar{margin:0 14px}
.debt-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px;flex-wrap:wrap}
.debt-foot small{color:var(--muted);font-weight:600;font-size:12.5px}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.late{color:var(--exp);font-weight:700}
.done-tag{font-size:12.5px;font-weight:800;color:var(--inc)}
.pays{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pays div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sheet h3{margin:0;font-size:18px;font-weight:800}
.news{display:flex;flex-direction:column;gap:6px;border-color:var(--accent);background:var(--accent-soft)}
.news ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.tabs button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:7;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);font-size:30px;line-height:1;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}}

/* Sheet */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(5,12,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amount:focus-within{border-color:var(--accent)}
.amount input{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-weight:600;font-size:34px;outline:none;padding:0}
.amount span{font-family:var(--display);font-size:26px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px 6px 8px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.cats button i{width:10px;height:10px;border-radius:50%}
.cats button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.err{color:var(--exp);font-size:13px;font-weight:600;min-height:1em;margin:0}

/* Onboarding */
.onb{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.onb h1{font-family:var(--display);font-size:26px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(() => {
'use strict';
// ---------- helpers ----------
const $ = s => document.querySelector(s);
// Currencies: [name, symbol, default rate in tenge per 1 unit]. Rates are edited by the person in Settings.
const CURRENCIES = {
  KZT: ['Казахстанский тенге', '₸', 1], USD: ['Доллар США', '$', 520], EUR: ['Евро', '€', 600], RUB: ['Российский рубль', '₽', 6.5],
  CNY: ['Китайский юань', '¥', 72], KGS: ['Киргизский сом', 'сом', 6], UZS: ['Узбекский сум', 'сум', 0.041], TRY: ['Турецкая лира', '₺', 13],
  AED: ['Дирхам ОАЭ', 'AED', 142], GBP: ['Фунт стерлингов', '£', 690], GEL: ['Грузинский лари', '₾', 190]
};
const fmtCache = {};
const base = () => S.wallet?.base || 'KZT';
const fmt = (n, cur) => {
  cur = cur || base();
  const f = fmtCache[cur] || (fmtCache[cur] = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', minimumFractionDigits: 0, maximumFractionDigits: 2 }));
  return f.format(Math.round((n || 0) * 100) / 100);
};
const sym = cur => CURRENCIES[cur]?.[1] || cur;
const rate = cur => cur === 'KZT' ? 1 : (num(S.wallet?.rates?.[cur]) || CURRENCIES[cur]?.[2] || 1);
const conv = (n, from, to) => { to = to || base(); return from === to ? n : n * rate(from) / rate(to); };
const accCur = id => acc(id)?.currency || 'KZT';
// Hidden currencies: their accounts leave the overview, the total and the account pickers until shown again.
const isHiddenCur = c => (S.wallet?.hiddenCur || []).includes(c);
const visibleAccounts = keep => S.wallet.accounts.filter(a => !isHiddenCur(accCur(a.id)) || a.id === keep);
const walletCurrencies = () => [...new Set(S.wallet.accounts.map(a => accCur(a.id)))];
const curOptions = sel => Object.entries(CURRENCIES).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${k} · ${esc(v[0])}</option>`).join('');
const fmtShort = n => { const a = Math.abs(n); if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' млн'; if (a >= 1e4) return Math.round(n / 1e3) + ' тыс'; return Math.round(n).toLocaleString('ru-RU'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);

const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monthLabel = m => { const [y, mm] = m.split('-').map(Number); return MONTHS[mm - 1] + (y !== new Date().getFullYear() ? ' ' + y : ''); };
const shiftMonth = (m, k) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const dayLabel = s => { const t = today(); const y = new Date(); y.setDate(y.getDate() - 1); if (s === t) return 'Сегодня'; if (s === ymd(y)) return 'Вчера'; const [yy, mm, dd] = s.split('-').map(Number); return dd + ' ' + MONTHS_GEN[mm - 1] + (yy !== new Date().getFullYear() ? ' ' + yy : ''); };
const parseAmount = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
const clone = o => JSON.parse(JSON.stringify(o));
const COLORS = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11'];

const DEFAULT_CATS = [
  ['Продукты','expense','c1'],['Кафе и рестораны','expense','c2'],['Транспорт','expense','c3'],['Жильё и ЖКУ','expense','c4'],
  ['Связь и интернет','expense','c6'],['Здоровье','expense','c7'],['Одежда','expense','c5'],['Развлечения','expense','c8'],
  ['Подписки','expense','c11'],['Подарки','expense','c10'],['Другое','expense','c9'],
  ['Зарплата','income','c1'],['Подработка','income','c3'],['Кешбэк и проценты','income','c4'],['Подарки','income','c7'],['Другое','income','c9']
].map(([name, type, color]) => ({ id: newId(), name, type, color, budget: 0 }));

// ---------- state ----------
// ---------- versions & data compatibility ----------
// RULES FOR UPDATES: never rename the tables (wallets, transactions, debts) or the JSON fields inside
// their `data` column; only ADD fields, and teach norm*() below to fill them in for older data.
// Old data must always load in a new version.
const APP_VERSION = 15;
const SCHEMA = 3;
const CHANGELOG = [
  { v: 15, items: ['В «Аналитике» два круга — расходы и доходы по категориям, с процентами прямо на частях круга', 'Сверху — сколько заработали, потратили и какую часть дохода сохранили'] },
  { v: 14, items: ['Кнопка «Учитывать долги» в карточке баланса: показывает, сколько у вас будет, когда все долги вернут и вы вернёте свои'] },
  { v: 13, items: ['Галочка «Не учитывать в статистике» в окне операции: деньги меняют баланс счёта, но не попадают в доходы, расходы, аналитику и бюджеты'] },
  { v: 12, items: ['Валюту можно скрыть: нажмите на неё над списком счетов на «Обзоре» — её счета пропадут из списка и общего баланса. Нажмите ещё раз, чтобы вернуть'] },
  { v: 11, items: ['Кошелёк — отдельное приложение: вход по почте, данные на сервере, видны только вам', 'Синхронизация между телефоном и компьютером', 'Без интернета изменения сохраняются на телефоне и отправляются позже'] },
  { v: 10, items: ['Понятное объяснение, где хранятся данные, если кошелёк открыт с чужого аккаунта', 'Проверка, помнит ли телефон кошелёк между запусками — в «Настройках»'] },
  { v: 9, items: ['Данные владельца кошелька сохраняются в аккаунт и на iPhone, даже когда приложение не сообщает, кто вы'] },
  { v: 8, items: ['Кошелёк точнее определяет, почему данные не попадают в аккаунт, и подсказывает, что сделать', 'Кнопка «Разрешить доступ», если доступ к хранилищу был запрещён'] },
  { v: 7, items: ['Кошелёк сразу предупреждает, если данные не сохраняются в аккаунт, и объясняет, что сделать', 'Операции, введённые без входа в аккаунт, можно перенести в аккаунт одной кнопкой'] },
  { v: 6, items: ['Кнопки «Пополнить», «Расход» и «Перевод» прямо на «Обзоре»', 'Счета в разных валютах: доллары, евро, рубли и другие', 'Общий баланс и статистика пересчитываются в основную валюту по вашему курсу'] },
  { v: 5, items: ['Обновления приходят сами, все данные сохраняются', 'После обновления показывается, что нового'] },
  { v: 4, items: ['Резервная копия и восстановление в «Настройках»', 'Кошелёк можно отправить другим людям по ссылке'] },
  { v: 3, items: ['Учёт долгов: кто кому должен, частичные возвраты, сроки'] },
  { v: 2, items: ['Все суммы в тенге ₸'] }
];
const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : d; };
function normWallet(w) {
  if (!w || typeof w !== 'object') return null;
  const out = { ...w, schema: SCHEMA };
  out.accounts = (Array.isArray(w.accounts) ? w.accounts : []).filter(a => a && a.id).map(a => ({ ...a, name: a.name || 'Счёт', initial: num(a.initial), currency: CURRENCIES[a.currency] ? a.currency : 'KZT' }));
  out.categories = (Array.isArray(w.categories) ? w.categories : []).filter(c => c && c.id).map((c, i) => ({ ...c, name: c.name || 'Категория', type: c.type === 'income' ? 'income' : 'expense', color: c.color || 'c' + (i % 11 + 1), budget: num(c.budget) }));
  out.base = CURRENCIES[w.base] ? w.base : 'KZT';
  out.rates = w.rates && typeof w.rates === 'object' ? { ...w.rates } : {};
  out.hiddenCur = Array.isArray(w.hiddenCur) ? w.hiddenCur.filter(c => CURRENCIES[c]) : [];
  out.withDebts = !!w.withDebts;
  return out;
}
const normTx = t => ({ ...t, ...(t.toAmount != null ? { toAmount: num(t.toAmount) } : {}), type: ['income', 'expense', 'transfer'].includes(t.type) ? t.type : 'expense', amount: num(t.amount), date: t.date || today() });
const normDebt = d => ({ ...d, dir: d.dir === 'borrowed' ? 'borrowed' : 'lent', person: d.person || '—', amount: num(d.amount), date: d.date || today(), due: d.due || '', note: d.note || '', accountId: d.accountId || '', payments: (Array.isArray(d.payments) ? d.payments : []).map(p => ({ ...p, amount: num(p.amount), date: p.date || today() })) });

const S = { wallet: null, tx: [], debts: [], debtShow: 'active', loaded: false, note: '', tab: 'home', month: today().slice(0, 7), filter: 'all', q: '' };
S.auth = null;   // null | 'setup' | 'signin' | 'signup' | 'reset' | 'checkmail' | 'newpass'

// ---------- storage: Supabase — each person's own rows, protected by row-level security ----------
const CFG = window.KOSHELEK_CONFIG || {};
const sb = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'koshelek.auth' } })
  : null;
const isNetErr = e => !navigator.onLine || e instanceof TypeError || /fetch|network|load failed|timed out/i.test(String(e?.message || e || ''));
const appUrl = () => location.origin + location.pathname;

const store = {
  kind: 'cloud', uid: null, email: '', queue: [], busy: false, lastRefresh: 0,
  async init() {
    if (!sb) { S.auth = 'setup'; S.loaded = true; render(); return; }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') { S.auth = 'newpass'; render(); return; }
      if (event === 'SIGNED_OUT') { this.signedOut(); return; }
      if (session?.user && session.user.id !== this.uid) setTimeout(() => this.open(session.user));
    });
    let session = null;
    try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
    if (session?.user) { if (session.user.id !== this.uid) this.open(session.user); }
    else if (!this.uid && S.auth !== 'newpass') { S.auth = 'signin'; S.loaded = true; render(); }
    window.addEventListener('online', () => this.refresh());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - this.lastRefresh > 15000) this.refresh(); });
  },
  open(user) {
    this.uid = user.id; this.email = user.email || '';
    if (S.auth !== 'newpass') S.auth = null;
    try { this.queue = JSON.parse(localStorage.getItem('koshelek.queue.' + this.uid) || '[]'); } catch (e) { this.queue = []; }
    // Show what this device saw last time right away, then bring it up to date from the server.
    try {
      const c = JSON.parse(localStorage.getItem('koshelek.cache.' + this.uid) || 'null');
      if (c?.wallet) { S.wallet = normWallet(c.wallet); S.tx = (c.tx || []).map(normTx); S.debts = (c.debts || []).map(normDebt); S.loaded = true; }
    } catch (e) {}
    render();
    this.refresh();
  },
  signedOut() {
    if (this.uid) { try { localStorage.removeItem('koshelek.cache.' + this.uid); } catch (e) {} }
    this.uid = null; this.email = ''; this.queue = [];
    S.wallet = null; S.tx = []; S.debts = []; S.note = ''; S.auth = 'signin'; S.loaded = true; render();
  },
  cache() { if (this.uid) try { localStorage.setItem('koshelek.cache.' + this.uid, JSON.stringify({ wallet: S.wallet, tx: S.tx, debts: S.debts })); } catch (e) {} },
  saveQueue() { try { localStorage.setItem('koshelek.queue.' + this.uid, JSON.stringify(this.queue)); } catch (e) {} },
  async run(op) {
    const q = op.del
      ? sb.from(op.t).delete().eq('user_id', this.uid).eq('id', op.del)
      : sb.from(op.t).upsert((Array.isArray(op.rows) ? op.rows : [op.row]).map(r => ({ ...r, user_id: this.uid, updated_at: new Date().toISOString() })));
    const { error } = await q; if (error) throw error;
  },
  // Send changes made without internet, oldest first. Returns false while still offline.
  async flush() {
    while (this.queue.length) {
      try { await this.run(this.queue[0]); }
      catch (e) { if (isNetErr(e)) return false; console.warn('dropped change', e); }
      this.queue.shift(); this.saveQueue();
    }
    return true;
  },
  async write(op) {
    if (this.queue.length) { this.queue.push(op); this.saveQueue(); if (!(await this.flush())) throw { code: 'queued' }; return; }
    try { await this.run(op); }
    catch (e) { if (isNetErr(e)) { this.queue.push(op); this.saveQueue(); throw { code: 'queued' }; } throw e; }
  },
  async fetchAll(table) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from(table).select('id,data').eq('user_id', this.uid).order('id').range(from, from + 999);
      if (error) throw error;
      out.push(...data); if (data.length < 1000) break;
    }
    return out;
  },
  async refresh() {
    if (!this.uid || this.busy) return;
    this.busy = true; this.lastRefresh = Date.now();
    const uid = this.uid;
    try {
      if (!(await this.flush())) throw new TypeError('offline');
      const [w, tx, debts] = await Promise.all([
        sb.from('wallets').select('data').eq('user_id', uid).maybeSingle(),
        this.fetchAll('transactions'), this.fetchAll('debts')
      ]);
      if (w.error) throw w.error;
      if (uid !== this.uid) return;
      S.wallet = w.data ? normWallet(w.data.data) : null;
      S.tx = tx.map(r => normTx({ ...r.data, id: r.id }));
      S.debts = debts.map(r => normDebt({ ...r.data, id: r.id }));
      S.note = ''; this.cache();
    } catch (e) {
      S.note = isNetErr(e)
        ? 'Нет интернета. Показаны данные с этого телефона' + (this.queue.length ? ', ещё не отправлено изменений: ' + this.queue.length : '') + '. Всё отправится, когда связь появится.'
        : 'Не удалось загрузить данные с сервера (' + (e?.message || 'ошибка') + '). Откройте приложение заново.';
    } finally { this.busy = false; S.loaded = true; render(); }
  },
  async saveWallet(w) { S.wallet = w; this.cache(); render(); await this.write({ t: 'wallets', row: { data: w } }); },
  async saveTx(t) {
    const { id, ...body } = t; const i = S.tx.findIndex(x => x.id === id); if (i >= 0) S.tx[i] = t; else S.tx.push(t);
    this.cache(); render(); await this.write({ t: 'transactions', row: { id, data: body } });
  },
  async delTx(id) { S.tx = S.tx.filter(x => x.id !== id); this.cache(); render(); await this.write({ t: 'transactions', del: id }); },
  async saveDebt(d) {
    const { id, ...body } = d; const i = S.debts.findIndex(x => x.id === id); if (i >= 0) S.debts[i] = d; else S.debts.push(d);
    this.cache(); render(); await this.write({ t: 'debts', row: { id, data: body } });
  },
  async delDebt(id) { S.debts = S.debts.filter(x => x.id !== id); this.cache(); render(); await this.write({ t: 'debts', del: id }); },
  // Many rows at once (restoring a backup).
  async saveMany(tx, debts) {
    for (const t of tx) { const i = S.tx.findIndex(x => x.id === t.id); if (i >= 0) S.tx[i] = t; else S.tx.push(t); }
    for (const d of debts) { const i = S.debts.findIndex(x => x.id === d.id); if (i >= 0) S.debts[i] = d; else S.debts.push(d); }
    this.cache(); render();
    const rows = list => list.map(({ id, ...data }) => ({ id, data }));
    for (let i = 0; i < tx.length; i += 500) await this.write({ t: 'transactions', rows: rows(tx.slice(i, i + 500)) });
    for (let i = 0; i < debts.length; i += 500) await this.write({ t: 'debts', rows: rows(debts.slice(i, i + 500)) });
  }
};
const safe = async (fn, okMsg) => {
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    if (e?.code === 'queued') { toast('Сохранено на телефоне — отправится, когда появится интернет'); render(); return; }
    console.error(e);
    toast('Не сохранилось: ' + (e?.message || 'ошибка сервера') + '. Попробуйте ещё раз.');
    store.refresh();
  }
};

// ---------- files: share sheet on phones, download elsewhere ----------
async function saveFile(name, text, mime) {
  const file = new File([text], name, { type: mime });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e?.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ---------- derived data ----------
const acc = id => S.wallet.accounts.find(a => a.id === id);
const cat = id => S.wallet.categories.find(c => c.id === id);
function balances() {
  const b = {}; for (const a of S.wallet.accounts) b[a.id] = +a.initial || 0;
  for (const t of S.tx) {
    if (t.type === 'expense' && t.accountId in b) b[t.accountId] -= t.amount;
    else if (t.type === 'income' && t.accountId in b) b[t.accountId] += t.amount;
    else if (t.type === 'transfer') { if (t.accountId in b) b[t.accountId] -= t.amount; if (t.toAccountId in b) b[t.toAccountId] += (t.toAmount ?? t.amount); }
  }
  // Lending takes money out of the account, borrowing brings it in; repayments reverse that.
  for (const d of S.debts) {
    const s = d.dir === 'lent' ? -1 : 1;
    if (d.accountId in b) b[d.accountId] += s * d.amount;
    for (const p of d.payments || []) if (p.accountId in b) b[p.accountId] -= s * p.amount;
  }
  return b;
}
const debtPaid = d => (d.payments || []).reduce((s, p) => s + p.amount, 0);
const debtLeft = d => Math.round((d.amount - debtPaid(d)) * 100) / 100;
const activeDebts = () => S.debts.filter(d => debtLeft(d) > 0);
const debtCur = d => d.currency || (d.accountId && acc(d.accountId) ? accCur(d.accountId) : 'KZT');
const inMonth = (m) => S.tx.filter(t => t.date && t.date.startsWith(m));
// Operations marked noStats change account balances but stay out of every statistic.
const inStats = t => !t.noStats;
function totals(m) { let inc = 0, exp = 0; for (const t of inMonth(m).filter(inStats)) { const v = conv(t.amount, accCur(t.accountId)); if (t.type === 'income') inc += v; else if (t.type === 'expense') exp += v; } return { inc, exp }; }
const sortTx = arr => arr.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));

// ---------- rendering ----------
function txRow(t) {
  const c = cat(t.categoryId); const a = acc(t.accountId);
  let title, sub, color, letter, sign;
  if (t.type === 'transfer') { const to = acc(t.toAccountId); title = 'Перевод'; sub = (a?.name || '—') + ' → ' + (to?.name || '—') + (t.toAmount != null && accCur(t.toAccountId) !== accCur(t.accountId) ? ' · получено ' + fmt(t.toAmount, accCur(t.toAccountId)) : ''); color = 'var(--trf)'; letter = '⇄'; sign = ''; }
  else { title = c?.name || (t.noStats ? (t.type === 'income' ? 'Пополнение' : 'Списание') : 'Без категории'); sub = a?.name || '—'; color = 'var(--' + (c?.color || 'c9') + ')'; letter = (title[0] || '•').toUpperCase(); sign = t.type === 'income' ? '+' : '−'; }
  if (t.note) sub = t.note + ' · ' + sub;
  return `<button class="tx" data-edit="${esc(t.id)}"><span class="ico" style="background:${color}">${esc(letter)}</span>
    <span class="mid"><span class="t1">${esc(title)}${t.demo ? '<span class="demo">пример</span>' : ''}${t.noStats ? '<span class="demo nostat" title="Не учитывается в статистике">вне статистики</span>' : ''}</span><span class="t2" style="display:block">${esc(sub)}</span></span>
    <span class="amt num ${t.type}">${sign}${fmt(t.amount, accCur(t.accountId))}</span></button>`;
}
function txList(arr, grouped) {
  if (!arr.length) return '<div class="list"><div class="empty">Операций пока нет. Нажмите «+», чтобы добавить первую.</div></div>';
  if (!grouped) return '<div class="list">' + arr.map(txRow).join('') + '</div>';
  let html = '', cur = null;
  const dayTotal = d => arr.filter(t => t.date === d && inStats(t)).reduce((s, t) => s + conv(t.type === 'expense' ? -t.amount : t.type === 'income' ? t.amount : 0, accCur(t.accountId)), 0);
  for (const t of arr) {
    if (t.date !== cur) { cur = t.date; const dt = dayTotal(cur); html += `<div class="day"><span>${dayLabel(cur)}</span><span class="num">${dt ? (dt > 0 ? '+' : '−') + fmt(Math.abs(dt)) : ''}</span></div>`; }
    html += txRow(t);
  }
  return '<div class="list">' + html + '</div>';
}

function viewHome() {
  const b = balances(); const shown = visibleAccounts();
  const total = shown.reduce((s, a) => s + conv(b[a.id], accCur(a.id)), 0);
  const multi = shown.some(a => accCur(a.id) !== base());
  const curs = walletCurrencies(); const hidden = curs.filter(isHiddenCur);
  // "With debts": what you would have once everyone settles up — accounts + owed to you − what you owe.
  const openDebts = activeDebts().filter(d => !isHiddenCur(debtCur(d)));
  const owedToMe = openDebts.filter(d => d.dir === 'lent').reduce((s2, d) => s2 + conv(debtLeft(d), debtCur(d)), 0);
  const iOwe = openDebts.filter(d => d.dir === 'borrowed').reduce((s2, d) => s2 + conv(debtLeft(d), debtCur(d)), 0);
  const withDebts = !!S.wallet.withDebts && openDebts.length > 0;
  const { inc, exp } = totals(S.month); const diff = inc - exp;
  const recent = sortTx(S.tx).slice(0, 6);
  const news = whatsNew();
  const spent = spentByCat(S.month);
  const alerts = S.wallet.categories.filter(c => c.type === 'expense' && c.budget > 0 && (spent[c.id] || 0) >= c.budget * 0.8);
  const mGen = MONTHS_GEN[+S.month.slice(5) - 1];
  return `
  ${news.length ? `<section class="card news" aria-label="Что нового"><div class="sec-h"><h2>Что нового</h2><button class="link" data-seen>Понятно</button></div>
    <ul>${news.flatMap(n => n.items).map(i => `<li>${esc(i)}</li>`).join('')}</ul></section>` : ''}
  <section class="hero">
    <div class="hero-top">
      <div class="lbl">${withDebts ? 'Всего с учётом долгов' : 'Всего на счетах'}${multi ? ', в ' + esc(base()) + ' по вашему курсу' : ''}${hidden.length ? ' · без ' + hidden.map(esc).join(', ') : ''}</div>
      ${openDebts.length ? `<button class="hero-toggle" data-withdebts aria-pressed="${withDebts}"><span class="sw" aria-hidden="true"></span>Учитывать долги</button>` : ''}
    </div>
    <div class="big num">${fmt(withDebts ? total + owedToMe - iOwe : total)}</div>
    ${withDebts ? `<div class="hero-debts num">На счетах ${fmt(total)}${owedToMe ? ' · вам должны +' + fmt(owedToMe) : ''}${iOwe ? ' · вы должны −' + fmt(iOwe) : ''}</div>` : ''}
    <div class="hero-row">
      <div><small>Доходы, ${MONTHS_SHORT[+S.month.slice(5) - 1]}</small><b class="num">+${fmt(inc)}</b></div>
      <div><small>Расходы</small><b class="num">−${fmt(exp)}</b></div>
      <div><small>Итог месяца</small><b class="num">${diff >= 0 ? '+' : '−'}${fmt(Math.abs(diff))}</b></div>
    </div>
    <div class="hero-act">
      <button data-quick="income"><span aria-hidden="true">+</span> Пополнить</button>
      <button data-quick="expense"><span aria-hidden="true">−</span> Расход</button>
      <button data-quick="transfer"><span aria-hidden="true">⇄</span> Перевод</button>
    </div>
  </section>
  <section class="sec"><div class="sec-h"><h2>Счета</h2><button class="link" data-goto="settings">Изменить</button></div>
    ${curs.length > 1 ? `<div class="chips cur-chips" role="group" aria-label="Показывать валюты">${curs.map(c => `<button class="chip" data-togglecur="${c}" aria-pressed="${!isHiddenCur(c)}" title="${isHiddenCur(c) ? 'Показать' : 'Скрыть'} ${c}">${isHiddenCur(c) ? '<span aria-hidden="true">◌</span>' : '<span aria-hidden="true">●</span>'} ${esc(sym(c))} ${c}</button>`).join('')}</div>` : ''}
    ${hidden.length ? `<p class="help">Скрыто: ${hidden.map(c => { const n = S.wallet.accounts.filter(a => accCur(a.id) === c).length; return esc(c) + ' (' + n + ' ' + (n === 1 ? 'счёт' : n < 5 ? 'счёта' : 'счетов') + ')'; }).join(', ')}. Нажмите на валюту, чтобы показать.</p>` : ''}
    <div class="accs">${shown.map(a => { const c = accCur(a.id); return `<div class="acc"><button class="acc-plus" data-topup="${a.id}" aria-label="Пополнить счёт ${esc(a.name)}">+</button><small>${esc(a.name)}</small><b class="num ${b[a.id] < 0 ? 'neg' : ''}">${fmt(b[a.id], c)}</b>${c !== base() ? `<small class="num">≈ ${fmt(conv(b[a.id], c))}</small>` : ''}</div>`; }).join('')}
      <button class="acc acc-new" data-newacc><b>+</b><small>Новый счёт</small></button></div>
  </section>
  ${debtSummary(true)}
  ${alerts.length ? `<section class="sec"><h2>Бюджеты на ${esc(MONTHS[+S.month.slice(5) - 1].toLowerCase())}</h2><div class="card legend">${alerts.map(c => budgetLine(c, spent[c.id] || 0)).join('')}</div></section>` : ''}
  <section class="sec"><div class="sec-h"><h2>Последние операции</h2>${S.tx.length > 6 ? '<button class="link" data-goto="ops">Все</button>' : ''}</div>${txList(recent, false)}</section>`;

function budgetLine(c, s) {
  const p = Math.min(100, s / c.budget * 100); const over = s > c.budget;
  return `<div class="lg"><i style="background:var(--${c.color})"></i><span class="nm">${esc(c.name)}</span><span class="pc num ${over ? 'over' : ''}">${Math.round(s / c.budget * 100)}%</span>
    <span class="bar"><span style="width:${p}%;background:${over ? 'var(--exp)' : 'var(--' + c.color + ')'}"></span></span>
    <span class="sub num">${fmt(s)} из ${fmt(c.budget)}${over ? ' · <span class="over">перерасход ' + fmt(s - c.budget) + '</span>' : ' · осталось ' + fmt(c.budget - s)}</span></div>`;
}

function debtSummary(onHome) {
  const act = activeDebts();
  if (onHome && !act.length) return '';
  const sum = dir => act.filter(d => d.dir === dir).reduce((s, d) => s + conv(debtLeft(d), debtCur(d)), 0);
  const cnt = dir => act.filter(d => d.dir === dir).length;
  const people = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'долг' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'долга' : 'долгов');
  const tag = onHome ? 'button data-goto="debts"' : 'div';
  const end = onHome ? 'button' : 'div';
  return `<section class="sec">${onHome ? '<div class="sec-h"><h2>Долги</h2><button class="link" data-goto="debts">Открыть</button></div>' : ''}<div class="dsum">
    <${tag}><small>Вам должны</small><b class="num in">${fmt(sum('lent'))}</b><small>${people(cnt('lent'))}</small></${end}>
    <${tag}><small>Вы должны</small><b class="num out">${fmt(sum('borrowed'))}</b><small>${people(cnt('borrowed'))}</small></${end}>
  </div></section>`;
}
function debtCard(d) {
  const left = debtLeft(d), paid = debtPaid(d), closed = left <= 0;
  const late = !closed && d.due && d.due < today();
  const parts = [d.dir === 'lent' ? 'Дал в долг' : 'Взял в долг', dayLabel(d.date)];
  if (d.due && !closed) parts.push(late ? `<span class="late">просрочен с ${esc(dayLabel(d.due))}</span>` : 'вернуть до ' + esc(dayLabel(d.due)));
  if (d.note) parts.push(esc(d.note));
  const color = d.dir === 'lent' ? 'var(--inc)' : 'var(--exp)';
  return `<div class="debt">
    <button class="tx" data-editdebt="${esc(d.id)}"><span class="ico" style="background:${color}">${esc((d.person[0] || '?').toUpperCase())}</span>
      <span class="mid"><span class="t1" style="display:block">${esc(d.person)}</span><span class="t2" style="display:block">${parts.join(' · ')}</span></span>
      <span class="amt num" style="color:${closed ? 'var(--muted)' : color}">${fmt(closed ? d.amount : left, debtCur(d))}</span></button>
    <div class="bar"><span style="width:${Math.min(100, paid / d.amount * 100)}%;background:${color}"></span></div>
    <div class="debt-foot"><small class="num">Возвращено ${fmt(paid, debtCur(d))} из ${fmt(d.amount, debtCur(d))}</small>
      ${closed ? '<span class="done-tag">Закрыт</span>' : `<button class="btn ghost sm" data-pay="${esc(d.id)}">Записать возврат</button>`}</div>
  </div>`;
}
function viewDebts() {
  const act = activeDebts(), closed = S.debts.filter(d => debtLeft(d) <= 0);
  const list = S.debtShow === 'active'
    ? act.slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (b.date || '').localeCompare(a.date || ''))

  return `${debtSummary(false)}
  <section class="sec"><div class="sec-h"><div class="chips">${f('active', 'Активные', act.length)}${f('closed', 'Закрытые', closed.length)}</div><button class="link" data-newdebt>+ Новый долг</button></div>
    ${list.length ? `<div class="debts">${list.map(debtCard).join('')}</div>` : `<div class="list"><div class="empty">${S.debtShow === 'active' ? 'Активных долгов нет. Нажмите «+», чтобы записать, кто кому должен.' : 'Закрытых долгов пока нет.'}</div></div>`}
  </section>`;
}

function viewOps() {
  let arr = inMonth(S.month);
  if (S.filter !== 'all') arr = arr.filter(t => t.type === S.filter);
  const q = S.q.trim().toLowerCase();
  if (q) arr = arr.filter(t => [t.note, cat(t.categoryId)?.name, acc(t.accountId)?.name, String(t.amount)].join(' ').toLowerCase().includes(q));
  const f = (k, l) => `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${l}</button>`;
  return `<section class="sec">
    <input class="search" id="q" type="search" placeholder="Поиск по комментарию, категории, сумме" value="${esc(S.q)}">
    <div class="chips">${f('all', 'Все')}${f('expense', 'Расходы')}${f('income', 'Доходы')}${f('transfer', 'Переводы')}</div>
  </section>
  <section class="sec" id="opsList">${arr.length || !q ? txList(sortTx(arr), true) : '<div class="list"><div class="empty">Ничего не нашлось</div></div>'}</section>`;
}

function spentByCat(m) { const r = {}; for (const t of inMonth(m)) if (t.type === 'expense' && inStats(t)) r[t.categoryId] = (r[t.categoryId] || 0) + conv(t.amount, accCur(t.accountId)); return r; }
// A share as people read it: never "0%" for something that is there, never "100%" when something else is.
const share = (v, total) => { const x = v / total * 100; return x > 0 && x < 1 ? '<1' : x > 99 && v < total ? '99' : String(Math.round(x)); };
function byCat(m, type) { const r = {}; for (const t of inMonth(m)) if (t.type === type && inStats(t)) r[t.categoryId] = (r[t.categoryId] || 0) + conv(t.amount, accCur(t.accountId)); return r; }
// Ring chart: one arc per category, its share written on the arc when there is room for it (5% and up).
function donut(parts, total, label) {
  const CX = 110, R = 78, W = 36, C = 2 * Math.PI * R; let off = 0;
  const pct = v => share(v, total);
  const arcs = parts.map(p => {
    const len = p.v / total * C; const gap = parts.length > 1 ? Math.min(2.5, len / 2) : 0;
    const arc = `<circle r="${R}" cx="${CX}" cy="${CX}" fill="none" stroke="var(--${p.color})" stroke-width="${W}" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${CX} ${CX})"><title>${esc(p.name)}: ${pct(p.v)}% · ${esc(fmt(p.v))}</title></circle>`;
    let txt = '';
    if (p.v / total >= 0.05) {
      const a = ((off + len / 2) / C) * 2 * Math.PI - Math.PI / 2;
      txt = `<text class="pct" x="${(CX + R * Math.cos(a)).toFixed(1)}" y="${(CX + R * Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${pct(p.v)}%</text>`;
    }
    off += len; return { arc, txt };
  });
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="${esc(label)} по категориям: ${parts.map(p => esc(p.name) + ' ' + pct(p.v) + '%').join(', ')}">
    <circle r="${R}" cx="${CX}" cy="${CX}" fill="none" stroke="var(--surface-2)" stroke-width="${W}"/>${arcs.map(x => x.arc).join('')}${arcs.map(x => x.txt).join('')}
    <text x="${CX}" y="${CX - 9}" text-anchor="middle" font-size="12" font-weight="600" opacity=".7">${esc(label)}</text>
    <text x="${CX}" y="${CX + 12}" text-anchor="middle" font-size="17" font-weight="800">${esc(fmtShort(total))} ${esc(sym(base()))}</text></svg>`;
}
function catBlock(type, m) {
  const sums = byCat(m, type);
  const total = Object.values(sums).reduce((a, v) => a + v, 0);
  const label = type === 'expense' ? 'расходы' : 'доходы';
  const mon = MONTHS_GEN[+m.slice(5) - 1];
  if (!total) return `<div class="card"><div class="empty">${type === 'expense' ? 'Расходов' : 'Доходов'} за ${esc(MONTHS[+m.slice(5) - 1].toLowerCase())} пока нет</div></div>`;
  const parts = Object.entries(sums).map(([id, v]) => { const c = cat(id); return { id, v, name: c?.name || 'Без категории', color: c?.color || 'c9' }; }).sort((a, b) => b.v - a.v);
  return `<div class="card"><div class="donut-wrap">${donut(parts, total, label)}
    <div class="legend">${parts.map(p => `<div class="lg"><i style="background:var(--${p.color})"></i><span class="nm">${esc(p.name)}</span><span class="pc num"><b>${share(p.v, total)}%</b> · ${fmt(p.v)}</span></div>`).join('')}</div></div></div>`;
}

function viewStats() {
  const spent = spentByCat(S.month);
  const { inc, exp } = totals(S.month);
  const saved = inc - exp; const savedPct = inc > 0 ? Math.round(saved / inc * 100) : null;
  const monName = esc(MONTHS[+S.month.slice(5) - 1].toLowerCase());
  const months = []; for (let i = 5; i >= 0; i--) months.push(shiftMonth(S.month, -i));
  const ms = months.map(m => ({ m, ...totals(m) })); const max = Math.max(1, ...ms.map(x => Math.max(x.inc, x.exp)));
  const budgeted = S.wallet.categories.filter(c => c.type === 'expense' && c.budget > 0);
  return `<section class="sec"><h2>Итог за ${monName}</h2>
    <div class="sumrow">
      <div><small>Доходы</small><b class="num inc">+${fmt(inc)}</b></div>
      <div><small>Расходы</small><b class="num exp">−${fmt(exp)}</b>${inc > 0 ? `<small class="num">${Math.round(exp / inc * 100)}% от доходов</small>` : ''}</div>
      <div><small>${saved >= 0 ? 'Сохранили' : 'Ушли в минус'}</small><b class="num">${saved >= 0 ? '+' : '−'}${fmt(Math.abs(saved))}</b>${savedPct != null && saved >= 0 ? `<small class="num">${savedPct}% дохода</small>` : ''}</div>
    </div>
    ${inc + exp > 0 ? `<div class="ratio" role="img" aria-label="Доходы ${Math.round(inc / (inc + exp) * 100)}%, расходы ${Math.round(exp / (inc + exp) * 100)}%"><span style="width:${inc / (inc + exp) * 100}%;background:var(--inc)"></span><span style="width:${exp / (inc + exp) * 100}%;background:var(--exp)"></span></div>` : ''}
  </section>
  <section class="sec"><h2>Расходы за ${monName}</h2>${catBlock('expense', S.month)}</section>
  <section class="sec"><h2>Доходы за ${monName}</h2>${catBlock('income', S.month)}</section>
  <section class="sec"><h2>Бюджеты</h2><div class="card legend">${budgeted.length ? budgeted.map(c => budgetLine(c, spent[c.id] || 0)).join('') : '<p class="help">Задайте месячный лимит для категорий в «Настройках» — здесь появится, сколько осталось.</p>'}</div></section>
  <section class="sec"><h2>Доходы и расходы за полгода</h2><div class="card">
    <div class="cols">${ms.map(x => `<div class="col ${x.m === S.month ? 'cur' : ''}"><div class="pair"><span title="Доходы ${fmt(x.inc)}" style="height:${x.inc / max * 100}%;background:var(--inc)"></span><span title="Расходы ${fmt(x.exp)}" style="height:${x.exp / max * 100}%;background:var(--exp)"></span></div><small>${MONTHS_SHORT[+x.m.slice(5) - 1]}</small></div>`).join('')}</div>
    <div class="key"><span><i style="background:var(--inc)"></i>Доходы</span><span><i style="background:var(--exp)"></i>Расходы</span><span class="num">макс. ${fmt(max)}</span></div>
  </div></section>`;
}

function viewSettings() {
  const used = new Set([...S.tx.flatMap(t => [t.accountId, t.toAccountId, t.categoryId]), ...S.debts.flatMap(d => [d.accountId, ...(d.payments || []).map(p => p.accountId)])]);
  const exp = S.wallet.categories.filter(c => c.type === 'expense'), inc = S.wallet.categories.filter(c => c.type === 'income');
  const demoCount = S.tx.filter(t => t.demo).length;
  const catRows = (list, withBudget) => list.map(c => `<div class="row"><label for="cn-${c.id}"><i style="background:var(--${c.color})"></i><input id="cn-${c.id}" data-catname="${c.id}" value="${esc(c.name)}" aria-label="Название категории"></label>
      ${withBudget ? `<input id="cb-${c.id}" data-budget="${c.id}" inputmode="decimal" placeholder="Без лимита" value="${c.budget || ''}" aria-label="Лимит в месяц">` : '<span></span>'}

async function submitAuth() {
  const m = S.auth, err = $('#au-err'), go = $('#au-go');
  const email = ($('#au-email')?.value || '').trim(), pass = $('#au-pass')?.value || '', pass2 = $('#au-pass2')?.value;
  if (email) S.authEmail = email;
  S.authMsg = '';
  if (m !== 'newpass' && !/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Введите адрес почты'; return; }
  if (m !== 'reset' && pass.length < 6) { err.textContent = 'Пароль должен быть не короче 6 символов'; return; }
  if ((m === 'signup' || m === 'newpass') && pass !== pass2) { err.textContent = 'Пароли не совпадают'; return; }
  go.disabled = true; err.textContent = '';
  try {
    if (m === 'signin') { const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw error; }
    if (m === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: appUrl() } }); if (error) throw error;
      if (!data.session) { S.auth = 'checkmail'; render(); return; }
    }
    if (m === 'reset') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: appUrl() }); if (error) throw error;
      S.auth = 'signin'; S.authMsg = 'Письмо отправлено. Откройте ссылку из него на этом устройстве.'; render(); return;
    }
    if (m === 'newpass') {
      const { data, error } = await sb.auth.updateUser({ password: pass }); if (error) throw error;
      S.auth = null; toast('Пароль изменён'); if (data?.user) store.open(data.user); else render(); return;
    }
  } catch (e) { err.textContent = authError(e); go.disabled = false; }
}

document.addEventListener('change', e => {

  if (el.id === 'f-nostats' && draft) { readSheet(); drawSheet(); return; }
  if ((el.id === 'f-acc' || el.id === 'f-to') && draft) { readSheet(); if (el.id === 'f-to' || el.id === 'f-acc') draft.toAmount = ''; drawSheet(); return; }
  if ((el.id === 'd-acc' || el.id === 'd-cur') && ddraft) { readDebt(); drawDebt(); return; }
  if (el.id === 'a-cur' && adraft) { readAccount(); adraft.rate = ''; drawAccount(); return; }
  if (el.id === 'baseCur' && S.wallet && el.value !== base()) { const x = clone(S.wallet); x.base = el.value; safe(() => store.saveWallet(x), 'Основная валюта: ' + el.value); return; }
  if (el.dataset.rate && S.wallet) { const r = parseAmount(el.value); if (!(r > 0)) { toast('Курс должен быть больше нуля'); render(); return; } const x = clone(S.wallet); x.rates = { ...(x.rates || {}), [el.dataset.rate]: r }; safe(() => store.saveWallet(x), 'Курс сохранён'); return; }
  if (el.dataset.acccur && S.wallet) { const x = clone(S.wallet); const a = x.accounts.find(a => a.id === el.dataset.acccur); if (a) { a.currency = el.value; safe(() => store.saveWallet(x), 'Валюта счёта: ' + el.value); } return; }

  if (!S.wallet) return;
  const x = clone(S.wallet); let changed = false;
  if (ds.accname) { const a = x.accounts.find(a => a.id === ds.accname); const v = el.value.trim(); if (a && v && v !== a.name) { a.name = v; changed = true; } }
  if (ds.accinit) { const a = x.accounts.find(a => a.id === ds.accinit); const v = parseAmount(el.value || 0); if (a && isFinite(v) && v !== a.initial) { a.initial = v; changed = true; } }
  if (ds.catname) { const c = x.categories.find(c => c.id === ds.catname); const v = el.value.trim(); if (c && v && v !== c.name) { c.name = v; changed = true; } }
  if (ds.budget) { const c = x.categories.find(c => c.id === ds.budget); const v = el.value.trim() ? parseAmount(el.value) : 0; if (c && isFinite(v) && v >= 0 && v !== c.budget) { c.budget = v; changed = true; } }
  if (changed) safe(() => store.saveWallet(x), 'Сохранено');
});

function seenVersion() { try { return parseInt(localStorage.getItem('wallet.seenVersion') || '0', 10) || 0; } catch (e) { return APP_VERSION; } }
function markSeen() { try { localStorage.setItem('wallet.seenVersion', String(APP_VERSION)); } catch (e) {} }
function whatsNew() {
  const seen = seenVersion(); if (seen >= APP_VERSION) return [];
  // Someone who has never seen the panel gets only the latest release notes.
  return CHANGELOG.filter(c => c.v > seen && (seen > 0 || c.v === APP_VERSION));
}
document.addEventListener('click', e => { if (e.target.closest('[data-seen]')) { markSeen(); render(); } });

const TABS = ['home', 'ops', 'stats', 'debts', 'settings'];
function start() {
  try { const t = localStorage.getItem('wallet.tab'); if (TABS.includes(t)) S.tab = t; } catch (e) {}
  store.init();
}
start();
})();
</script>
